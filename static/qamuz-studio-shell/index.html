<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QAMUZ Studio v1</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#04050a;color:#fff;overflow:hidden}button,input,textarea{font:inherit}.shell{position:relative;height:100vh;min-height:620px;overflow:hidden;background:#04050a}.room{position:absolute;inset:-60px;transform:translateY(36px) scaleX(1.12) scaleY(1.015);background:url('/assets/qamuz-studio-entry-v1.png') center/cover no-repeat;opacity:.95}.shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(8,12,26,.06),rgba(3,5,10,.32) 57%,rgba(1,2,5,.8) 100%)}.glass{pointer-events:none;position:absolute;left:20%;right:20%;top:8%;height:55%;border:1px solid rgba(221,214,254,.28);border-radius:29px;background:rgba(7,11,20,.4);box-shadow:0 0 85px rgba(99,72,210,.2),inset 0 1px rgba(255,255,255,.1);backdrop-filter:blur(6px)}.entry{position:absolute;z-index:5;left:50%;top:43%;width:min(510px,calc(100% - 36px));transform:translate(-50%,-50%);overflow:hidden;border:1px solid rgba(221,214,254,.38);border-radius:24px;background:rgba(9,13,24,.82);box-shadow:0 35px 110px rgba(0,0,0,.74),0 0 65px rgba(104,72,220,.2),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(22px)}header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.1)}header p{margin:0;color:#c4b5fd;font-size:11px;font-weight:800;letter-spacing:.22em}h1{margin:8px 0 0;font-size:24px}.body{padding:22px;display:grid;gap:16px}.notice,.card{padding:15px;border:1px solid rgba(34,211,238,.16);border-radius:16px;background:rgba(34,211,238,.05);color:#dce6f4;font-size:14px;line-height:1.55}.card{border-color:rgba(167,139,250,.25);background:rgba(139,92,246,.1);text-align:left}.card small,.card span{display:block;color:#9ca3af}.card strong{display:block;margin:5px 0;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 16px;background:rgba(0,0,0,.18);color:#e2e8f0;cursor:pointer}.primary{border:0;background:linear-gradient(90deg,#7c3aed,#06b6d4);font-weight:750;color:white}.btn:disabled{opacity:.4}label{font-size:13px;color:#cbd5e1}textarea,input{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;background:rgba(0,0,0,.35);color:white;outline:none}textarea{height:118px;resize:none}textarea:focus,input:focus{border-color:#a78bfa}.sessions{display:grid;gap:8px;max-height:300px;overflow:auto}.hidden{display:none!important}.studio{position:absolute;inset:0;z-index:4}.studio iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}.badge{pointer-events:none;position:absolute;z-index:6;bottom:3%;left:50%;transform:translateX(-50%);padding:8px 20px;border:1px solid rgba(196,181,253,.2);border-radius:999px;background:rgba(7,9,18,.75);color:rgba(221,214,254,.8);font-size:10px;font-weight:750;letter-spacing:.18em;backdrop-filter:blur(14px)}@media(max-width:900px){.glass{left:4%;right:4%}.entry{top:45%}.room{transform:translateY(30px) scale(1.08)}}
  </style>
</head>
<body>
  <main class="shell"><div class="room"></div><div class="shade"></div><div class="glass"></div>
    <section class="entry" id="entry"><header><p>QAMUZ · MAESTRO</p><h1>QAMUZ Studio</h1></header><div class="body" id="panel"></div></section>
    <section class="studio hidden" id="studio"><iframe id="engine" title="QAMUZ Studio v1" allow="clipboard-read; clipboard-write; autoplay"></iframe><div class="badge">QAMUZ DIGITAL MIX CONSOLE · SESIÓN ACTIVA</div></section>
  </main>
  <script>
    const key='qamuz.studio.sessions.v1';let view='home',idea='',name='';
    const sessions=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=s=>String(s||'').trim().toLowerCase().replace(/[\s_-]+/g,' ');
    const base=s=>'QAMUZ-'+(String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2).slice(0,4).map(x=>x[0].toUpperCase()+x.slice(1).toLowerCase()).join('-')||'Nueva-Cancion');
    function available(requested){let list=sessions(),b=requested.trim()||base(idea);if(!list.some(x=>norm(x.name)===norm(b)))return b;let g=/merengue/i.test(idea)?'merengue':/salsa/i.test(idea)?'salsa':/bachata/i.test(idea)?'bachata':'new',p=`${b}-${g}`,i=2;while(list.some(x=>norm(x.name)===norm(p)))p=`${b}-${g}-${i++}`;return p}
    function launch(record,isNew){let list=sessions(),now=new Date().toISOString();localStorage.setItem(key,JSON.stringify([{...record,updatedAt:now},...list.filter(x=>norm(x.name)!==norm(record.name))]));sessionStorage.setItem('qamuz.studio.current',JSON.stringify(record));let p=new URLSearchParams({ui:'qamuz-v11',embedded:'1',inner:'1',session:record.name,existing:isNew?'0':'1',newSession:isNew?'1':'0',idea:record.idea||'',autoPlan:isNew?'1':'0'});document.getElementById('engine').src='/qamuz-studio-v1/index.html?'+p;document.getElementById('entry').classList.add('hidden');document.getElementById('studio').classList.remove('hidden')}
    function render(){let list=sessions(),p=document.getElementById('panel');if(view==='home'){p.innerHTML=`<div class="notice">¡Qué bueno verte otra vez! ¿Continuamos con la última canción o creamos una sesión nueva?</div>${list[0]?`<button class="card" id="last"><small>CONTINUAR ÚLTIMA SESIÓN</small><strong>${esc(list[0].name)}</strong><span>${esc(list[0].idea)}</span></button>`:''}<div class="row"><button class="btn" id="list">Ver mis sesiones (${list.length})</button><button class="btn primary" id="new">＋ Nueva canción</button></div>`;if(list[0])document.getElementById('last').onclick=()=>launch(list[0],false);document.getElementById('list').onclick=()=>{view='list';render()};document.getElementById('new').onclick=()=>{view='idea';idea='';render()}}else if(view==='list'){p.innerHTML=`<div class="notice">Elige la sesión que deseas continuar.</div><div class="sessions">${list.map((x,i)=>`<button class="card" data-i="${i}"><strong>${esc(x.name)}</strong><span>${esc(x.idea)}</span></button>`).join('')}</div><button class="btn" id="back">Volver</button>`;p.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>launch(list[+b.dataset.i],false));document.getElementById('back').onclick=()=>{view='home';render()}}else if(view==='idea'){p.innerHTML=`<div class="notice">Esta será una sesión nueva. Dime qué quieres que haga en esta canción.</div><label>Tu idea musical</label><textarea id="idea" placeholder="Ej.: Una bachata romántica y bailable sobre un amor que regresa…">${esc(idea)}</textarea><div class="row"><button class="btn" id="back">Atrás</button><button class="btn primary" id="next">Continuar</button></div>`;document.getElementById('back').onclick=()=>{view=list.length?'home':'idea';render()};document.getElementById('next').onclick=()=>{idea=document.getElementById('idea').value.trim();if(idea){view='name';render()}}}else{p.innerHTML=`<div class="notice">¿Cómo quieres llamar esta sesión? Si lo dejas vacío crearé un título QAMUZ.</div><label>Nombre de la sesión (opcional)</label><input id="name" placeholder="${esc(base(idea))}" value="${esc(name)}"><div class="row"><button class="btn" id="back">Atrás</button><button class="btn primary" id="open">Abrir sesión y trabajar</button></div>`;document.getElementById('back').onclick=()=>{view='idea';render()};document.getElementById('open').onclick=()=>{name=document.getElementById('name').value;let final=available(name);launch({name:final,idea,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),stage:'planning'},true)}}}
    view=sessions().length?'home':'idea';render();
  </script>
</body>
</html>
